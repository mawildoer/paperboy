# XcodeGen spec for the Paperboy iOS app.  `xcodegen generate` in this directory writes
# Paperboy.xcodeproj and Info.plist.  See README.md.
name: Paperboy

options:
  bundleIdPrefix: app.paperboy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: PTVJRD6TRB
    CODE_SIGN_STYLE: Automatic

packages:
  PaperboyCore:
    path: ../PaperboyCore

targets:
  Paperboy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: PaperboyCore
        product: PaperboyCore
      - package: PaperboyCore
        product: PaperboyBLE
      - target: PaperboyShare
    entitlements:
      path: Paperboy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.paperboy.readerc67aad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.paperboy.readerc67aad
        PRODUCT_NAME: Paperboy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Paperboy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Paperboy sends your articles to your Xteink reader over Bluetooth.
        # Background Modes: "Uses Bluetooth LE accessories", "Background fetch", "Background processing"
        UIBackgroundModes:
          - bluetooth-central
          - fetch
          - processing
        # Must match SyncCoordinator.refreshTaskIdentifier / processingTaskIdentifier
        BGTaskSchedulerPermittedIdentifiers:
          - local.paperboy.refresh
          - local.paperboy.processing

  # "Paperboy" in the share sheet: hands a page or link to the app (ShareExtension/).
  PaperboyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    entitlements:
      path: PaperboyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.paperboy.readerc67aad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.paperboy.readerc67aad.share
        PRODUCT_NAME: PaperboyShare
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Paperboy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionJavaScriptPreprocessingFile: SharePage
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
