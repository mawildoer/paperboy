name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test reader extraction
        run: npm ci --ignore-scripts && npm test
      - name: Test shared package
        run: swift test --package-path PaperboyCore
      - name: Build Mac sync tool
        run: swift build --package-path paperboy-cli
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate iOS project
        working-directory: Paperboy
        run: xcodegen generate
      - name: Verify PDF sharing and document registration
        run: swift tests/share-activation.swift
      - name: Type-check Apple status validator
        run: swiftc -typecheck -swift-version 6 scripts/check-testflight.swift
      - name: Build iOS app and share extension
        run: >-
          xcodebuild -project Paperboy/Paperboy.xcodeproj -scheme Paperboy
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
