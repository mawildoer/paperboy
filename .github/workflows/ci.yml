name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build-ios:
    needs: checks
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode and iOS SDK
        run: sh scripts/check-xcode.sh
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate iOS project
        working-directory: Paperboy
        run: xcodegen generate
      - name: Build iOS app and share extension
        run: >-
          xcodebuild -project Paperboy/Paperboy.xcodeproj -scheme Paperboy
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath .build/ios CODE_SIGNING_ALLOWED=NO build
