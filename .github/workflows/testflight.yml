name: Publish TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperboy-testflight
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mawildoer/paperboy' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode and iOS SDK
        run: sh scripts/check-xcode.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Test extraction
        run: npm ci --ignore-scripts && npm test
      - name: Test shared package
        run: swift test --package-path PaperboyCore
      - name: Install project generator
        run: brew install xcodegen
      - name: Verify PDF sharing
        run: |
          (cd Paperboy && xcodegen generate)
          swift tests/share-activation.swift
          swiftc -typecheck -swift-version 6 scripts/check-testflight.swift
      - name: Prepare signing keychain and build number
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/paperboy-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER)).${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TEAM_ID: PTVJRD6TRB
          TESTFLIGHT_OUTPUT: ${{ github.workspace }}/.build/testflight-release
        run: bash scripts/testflight.sh
      - name: Keep debug symbols
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Paperboy-dSYMs-${{ env.BUILD_NUMBER }}
          path: .build/testflight-release/Paperboy.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 30
      - name: Upload summary
        if: success()
        run: |
          echo "Uploaded Paperboy build **$BUILD_NUMBER** to App Store Connect for TestFlight processing." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          security delete-keychain "$RUNNER_TEMP/paperboy-signing.keychain-db" || true
